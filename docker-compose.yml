version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: llmcode-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: llmcode
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmcode-network

  redis:
    image: redis:7-alpine
    container_name: llmcode-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - llmcode-network

  mongodb:
    image: mongo:8
    container_name: llmcode-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: llm-code
    volumes:
      - mongodb_data:/data/db
    networks:
      - llmcode-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llmcode-backend-prod
    restart: always
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/llmcode
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      FLASH_BASE_URL: http://flash:8090
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-legacy}
      FLASH_ROLLOUT_PERCENTAGE: ${FLASH_ROLLOUT_PERCENTAGE:-0}
      FLASH_SCORE_WEIGHT: "0.7"
      LLM_SCORE_WEIGHT: "0.3"
      SESSIONS_DIR: /sessions
      TEMPLATES_DIR: /app/templates
      NGINX_SESSIONS_DIR: /etc/nginx/sessions
      PYTHONPATH: /app/flash_sdk:/app
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: llm-code
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./backend:/app
      - ./sandbox/sdk/python/flash:/app/flash_sdk/flash
      - /var/run/docker.sock:/var/run/docker.sock
      - sessions_dir:/sessions
      - session_confs:/etc/nginx/sessions
    ports:
      - "8000:7000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - llmcode-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:7000/health', timeout=5); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llmcode-frontend-prod
    restart: always
    volumes:
      - ./frontend/src:/usr/src/app/src
    expose:
      - "80"
    networks:
      - llmcode-network

  nginx:
    image: nginx:alpine
    container_name: llmcode-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - session_confs:/etc/nginx/sessions
    depends_on:
      - backend
      - frontend
    networks:
      - llmcode-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: llmcode-node-exporter
    restart: always
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - llmcode-network

  prometheus:
    image: prom/prometheus:latest
    container_name: llmcode-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'
    networks:
      - llmcode-network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  sessions_dir:
  session_confs:
  nginx_logs:
  prometheus_data:

networks:
  llmcode-network:
    driver: bridge